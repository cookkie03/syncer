x-dns-hosts: &dns-hosts
  # Docker Desktop on Windows/WSL2 blocks UDP/53 and the ISP DNS
  # (Telecom Italia) hijacks NXDOMAIN. extra_hosts bypasses DNS entirely.
  # Update IPs if they change: resolve via DoH (curl 'https://1.1.1.1/dns-query?name=HOST&type=A' -H 'accept: application/dns-json')
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "calendar.lucamanca.synology.me:${SYNOLOGY_IP:-79.50.144.75}"
    - "synologyds224.tail234659.ts.net:${SYNOLOGY_IP:-79.50.144.75}"
    - "api.notion.com:${NOTION_API_IP:-208.103.161.2}"
    - "api.telegram.org:${TELEGRAM_API_IP:-149.154.166.110}"
    - "www.googleapis.com:${GOOGLEAPIS_IP:-192.178.203.95}"
    - "oauth2.googleapis.com:${GOOGLEAPIS_OAUTH_IP:-142.251.127.95}"
    - "gmail.googleapis.com:${GMAIL_API_IP:-142.250.181.170}"
    - "people.googleapis.com:${PEOPLE_API_IP:-142.251.141.234}"

services:

  # ── spotify-backup: headless Spotify mirror backup ────────────────────────
  spotify-backup:
    build:
      context: ./spotify-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/spotify-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./spotify-backup/data:/data
      - ./spotify-backup/logs:/logs
    environment:
      - BACKUP_INTERVAL_MINUTES=240
      - BACKUP_DIR=/data/backup
      - CACHE_PATH=/data/.cache
      - LOG_DIR=/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import spotipy, requests; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── vdirsyncer: CalDAV → Google Calendar ──────────────────────────────────
  vdirsyncer:
    build:
      context: ./vdirsyncer
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/vdirsyncer:local
    restart: unless-stopped
    env_file: .env
    <<: *dns-hosts
    volumes:
      - ./vdirsyncer/status:/data/status
      - ./vdirsyncer/token:/data/token
      - ./vdirsyncer/logs:/logs
      - ./config/calendar-map.json:/app/calendar-map.json
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_DEVICE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_DEVICE_CLIENT_SECRET}
      - LOG_DIR=/logs
      - CALENDAR_MAP_FILE=/app/calendar-map.json
      - VDIRSYNCER_RUN_STARTUP_DISCOVER=1
      - VDIRSYNCER_RUN_STARTUP_SYNC=0
      - VDIRSYNCER_RUN_SCHEDULE=0
    healthcheck:
      test: ["CMD", "python", "-c", "import vdirsyncer; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

