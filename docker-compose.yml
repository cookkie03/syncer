services:

  # ── spotify-backup: headless Spotify mirror backup ────────────────────────
  spotify-backup:
    build:
      context: ./spotify-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/spotify-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./spotify-backup/data:/data
      - ./spotify-backup/logs:/logs
    environment:
      - BACKUP_INTERVAL_MINUTES=240
      - BACKUP_DIR=/data/backup
      - CACHE_PATH=/data/.cache
      - SPOTIFY_SNAPSHOT_DIR=/data/backup/snapshots
      - SPOTIFY_SNAPSHOT_RETENTION=${SPOTIFY_SNAPSHOT_RETENTION:-14}
      - LOG_DIR=/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import spotipy, requests; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── vdirsyncer: CalDAV → Google Calendar ──────────────────────────────────
  vdirsyncer:
    build:
      context: ./vdirsyncer
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/vdirsyncer:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./vdirsyncer/config:/data/vdirsyncer
      - ./vdirsyncer/status:/data/status
      - ./vdirsyncer/token:/data/token
      - ./vdirsyncer/logs:/logs
      - ./config/calendar-map.json:/app/calendar-map.json
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_DEVICE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_DEVICE_CLIENT_SECRET}
      - LOG_DIR=/logs
      - CALENDAR_MAP_FILE=/app/calendar-map.json
      - VDIRSYNCER_RUN_STARTUP_DISCOVER=1
      - VDIRSYNCER_RUN_STARTUP_SYNC=0
      - VDIRSYNCER_RUN_SCHEDULE=0
    healthcheck:
      test: ["CMD", "python", "-c", "import vdirsyncer; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

