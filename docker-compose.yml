  # ── caldav-backup: backup CalDAV calendars and tasks to ICS ───────────────
  caldav-backup:
    build:
      context: ./caldav-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/caldav-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./caldav-backup/backup:/backup
      - ./caldav-backup/logs:/logs
      - ./config/config.yaml:/app/config.yaml:ro
      - ./shared:/shared:ro
    environment:
      - CALDAV_BACKUP_DIR=/backup
      - CALDAV_BACKUP_RETENTION=${CALDAV_BACKUP_RETENTION:-14}
      - CALDAV_DISCOVER_INTERVAL_HOURS=${CALDAV_DISCOVER_INTERVAL_HOURS:-24}
      - LOG_DIR=/logs
    command: ["--watch", "--interval", "${CALDAV_BACKUP_INTERVAL_SECONDS:-14400}", "--discover-interval-hours", "${CALDAV_DISCOVER_INTERVAL_HOURS:-24}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

