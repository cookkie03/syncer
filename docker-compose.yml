services:

  # Todoist: read-only incremental account backup, prepared on the PC.
  todoist-backup:
    build:
      context: ./todoist-backup
    image: caldav-sync/todoist-backup:local
    restart: unless-stopped
    environment:
      - TODOIST_API_TOKEN=${TODOIST_API_TOKEN:-}
      - TODOIST_BACKUP_SCHEDULE=${TODOIST_BACKUP_SCHEDULE:-0 */4 * * *}
      - TODOIST_MAX_REQUESTS=${TODOIST_MAX_REQUESTS:-600}
      - TODOIST_MAX_RUN_SECONDS=${TODOIST_MAX_RUN_SECONDS:-1800}
      - TODOIST_HISTORY_WINDOWS=${TODOIST_HISTORY_WINDOWS:-20}
      - TODOIST_STATE_DIR=/state
      - TODOIST_BACKUP_DIR=/backup
      - TODOIST_LEGACY_DIR=/legacy-data
      - LOG_DIR=/logs
      - TZ=Europe/Amsterdam
    volumes:
      - ./todoist-backup/state:/state
      - ./todoist-backup/backup:/backup
      - ./todoist-backup/data:/legacy-data:ro
      - ./todoist-backup/logs:/logs
    healthcheck:
      test: ["CMD", "python", "/app/backup.py", "status", "--health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 35m

  # ── spotify-backup: headless Spotify mirror backup ────────────────────────
  spotify-backup:
    build:
      context: ./spotify-backup
    image: caldav-sync/spotify-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./spotify-backup/data:/data
      - ./spotify-backup/logs:/logs
    environment:
      - BACKUP_DIR=/data/backup
      - CACHE_PATH=/data/.cache
      - SPOTIFY_SNAPSHOT_DIR=/data/backup/snapshots
      - SPOTIFY_SNAPSHOT_RETENTION=${SPOTIFY_SNAPSHOT_RETENTION:-14}
      - LOG_DIR=/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import spotipy, requests; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── vdirsyncer: CalDAV → Google Calendar ──────────────────────────────────
  vdirsyncer:
    build:
      context: ./vdirsyncer
    image: caldav-sync/vdirsyncer:local
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
      - ${CALDAV_HOST_ALIAS:-synologyds224.tail234659.ts.net}:host-gateway
    volumes:
      - ./vdirsyncer/config:/data/vdirsyncer
      - ./vdirsyncer/status:/data/status
      - ./vdirsyncer/token:/data/token
      - ./vdirsyncer/logs:/logs
      - ./settings:/app/project-settings
      - ./setup/google:/run/syncer-google-client:ro
    environment:
      - GOOGLE_CLIENT_JSON_FILE=/run/syncer-google-client/client_secret.json
      - GOOGLE_TOKEN_FILE=/data/token/google.json
      - LOG_DIR=/logs
      - CALENDAR_MAP_FILE=/app/project-settings/calendar-pairings.json
      - VDIRSYNCER_RUN_STARTUP_SYNC=${VDIRSYNCER_RUN_STARTUP_SYNC:-1}
      - VDIRSYNCER_RUN_SCHEDULE=${VDIRSYNCER_RUN_SCHEDULE:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import vdirsyncer; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

