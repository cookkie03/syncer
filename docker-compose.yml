  # ── caldav-backup: backup CalDAV calendars and tasks to ICS ───────────────
  caldav-backup:
    build:
      context: ./caldav-backup
    image: caldav-sync/caldav-backup:local
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
      - ${CALDAV_HOST_ALIAS:-synologyds224.tail234659.ts.net}:host-gateway
    volumes:
      - ./caldav-backup/backup:/backup
      - ./caldav-backup/logs:/logs
    environment:
      - CALDAV_BACKUP_DIR=/backup
      - CALDAV_BACKUP_RETENTION=${CALDAV_BACKUP_RETENTION:-14}
      - LOG_DIR=/logs
    command: ["--watch", "--interval", "${CALDAV_BACKUP_INTERVAL_SECONDS:-14400}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── google-contacts-backup: Incremental Google Contacts Backup ────────────
  google-contacts-backup:
    build:
      context: ./google-contacts-backup
    image: caldav-sync/google-contacts-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./google-contacts-backup/backup:/backup
      - ./google-contacts-backup/logs:/logs
      - ./vdirsyncer/token:/data/token:ro
      - ./settings:/app/project-settings:ro
      - ./setup/google:/run/syncer-google-client:ro
    environment:
      - LOG_DIR=/logs
      - BACKUP_DIR=/backup
      - GOOGLE_CONTACTS_TOKEN_FILE=/data/token/google_contacts.json
      - GOOGLE_CLIENT_JSON_FILE=/run/syncer-google-client/client_secret.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import googleapiclient, vobject; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
