  # ── caldav-backup: backup CalDAV calendars and tasks to ICS ───────────────
  caldav-backup:
    build:
      context: ./caldav-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/caldav-backup:local
    restart: unless-stopped
    env_file: .env
    <<: *dns-hosts
    volumes:
      - ./caldav-backup/backup:/backup
      - ./caldav-backup/logs:/logs
      - ./config/config.yaml:/app/config.yaml:ro
      - ./shared:/shared:ro
    environment:
      - CALDAV_BACKUP_DIR=/backup
      - LOG_DIR=/logs
    command: ["--watch", "--interval", "14400"]
    healthcheck:
      test: ["CMD", "python", "-c", "import caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── google-contacts-backup: Incremental Google Contacts Backup ────────────
  google-contacts-backup:
    build:
      context: ./google-contacts-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/google-contacts-backup:local
    restart: unless-stopped
    env_file: .env
    <<: *dns-hosts
    volumes:
      - ./google-contacts-backup/backup:/backup
      - ./google-contacts-backup/logs:/logs
      - ./vdirsyncer/token:/data/token:ro
      - ./config/config.yaml:/app/config.yaml:ro
      - ./shared:/shared:ro
    environment:
      - LOG_DIR=/logs
      - BACKUP_DIR=/backup
      - GOOGLE_CONTACTS_TOKEN_FILE=/data/token/google_contacts.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import googleapiclient, vobject, caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
