services:

  # Todoist: read-only incremental account backup, prepared on the PC.
  todoist-backup:
    build:
      context: ./todoist-backup
    image: caldav-sync/todoist-backup:local
    restart: unless-stopped
    environment:
      - TODOIST_API_TOKEN=${TODOIST_API_TOKEN:-}
      - TODOIST_BACKUP_SCHEDULE=${TODOIST_BACKUP_SCHEDULE:-0 */4 * * *}
      - TODOIST_MAX_REQUESTS=${TODOIST_MAX_REQUESTS:-600}
      - TODOIST_MAX_RUN_SECONDS=${TODOIST_MAX_RUN_SECONDS:-1800}
      - TODOIST_HISTORY_WINDOWS=${TODOIST_HISTORY_WINDOWS:-20}
      - TODOIST_STATE_DIR=/state
      - TODOIST_BACKUP_DIR=/backup
      - TODOIST_LEGACY_DIR=/legacy-data
      - LOG_DIR=/logs
      - TZ=Europe/Amsterdam
    volumes:
      - ./todoist-backup/state:/state
      - ./todoist-backup/backup:/backup
      - ./todoist-backup/data:/legacy-data:ro
      - ./todoist-backup/logs:/logs
    healthcheck:
      test: ["CMD", "python", "/app/backup.py", "status", "--health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 35m

  # ── spotify-backup: headless Spotify mirror backup ────────────────────────
  spotify-backup:
    build:
      context: ./spotify-backup
    image: caldav-sync/spotify-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./spotify-backup/backup:/backup
      - ./spotify-backup/state:/state
      - ./backup_storage.py:/app/backup_storage.py:ro
      - ./spotify-backup/logs:/logs
    environment:
      - BACKUP_DIR=/backup
      - CACHE_PATH=/state/.cache
      - STATE_DIR=/state
      - SPOTIFY_SNAPSHOT_RETENTION=${SPOTIFY_SNAPSHOT_RETENTION:-14}
      - LOG_DIR=/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import spotipy, requests; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── vdirsyncer: CalDAV → Google Calendar ──────────────────────────────────
  vdirsyncer:
    build:
      context: ./vdirsyncer
    image: caldav-sync/vdirsyncer:local
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
      - ${CALDAV_HOST_ALIAS:-caldav.example.invalid}:host-gateway
    volumes:
      - ./vdirsyncer/state/config:/data/vdirsyncer
      - ./vdirsyncer/state/status:/data/status
      - ./vdirsyncer/state/token:/data/token
      - ./vdirsyncer/logs:/logs
      - ./settings:/app/project-settings
      - ./setup/google:/run/syncer-google-client:ro
    environment:
      - GOOGLE_CLIENT_JSON_FILE=/run/syncer-google-client/client_secret.json
      - GOOGLE_TOKEN_FILE=/data/token/google.json
      - LOG_DIR=/logs
      - CALENDAR_MAP_FILE=/app/project-settings/calendar-pairings.json
      - VDIRSYNCER_RUN_STARTUP_SYNC=${VDIRSYNCER_RUN_STARTUP_SYNC:-1}
      - VDIRSYNCER_RUN_SCHEDULE=${VDIRSYNCER_RUN_SCHEDULE:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import vdirsyncer; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── vtodo-notion: temporarily disabled ────────────────────────────────────
  # vtodo-notion:
  #   build:
  #     context: ./vtodo-notion
  #   image: caldav-sync/vtodo-notion:local
  #   restart: unless-stopped
  #   env_file: .env
  #   volumes:
  #     - ./vtodo-notion/state:/data
  #     - ./vtodo-notion/logs:/logs
  #     - ./settings:/app/project-settings:ro
  #   environment:
  #     - LOG_DIR=/logs
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import caldav, notion_client; print('ok')"]
  #     interval: 5m
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  # Notion: official API only. Opt-in until workspace access is verified.
  notion-backup:
    profiles: ["notion"]
    build:
      context: ./notion-backup
    image: caldav-sync/notion-backup:local
    restart: unless-stopped
    # Per-container caps for the 2 GiB NAS; equal RAM+swap prohibits swapping.
    mem_limit: "${NOTION_MEMORY_LIMIT:-256m}"
    memswap_limit: "${NOTION_MEMORY_LIMIT:-256m}"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      - NOTION_PAT=${NOTION_PAT:-}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_ROOTS=${NOTION_ROOTS:-}
      - NOTION_BACKUP_DIR=/backup
      - NOTION_BACKUP_INTERVAL_SECONDS=${NOTION_BACKUP_INTERVAL_SECONDS:-14400}
      - NOTION_BACKUP_RETENTION=${NOTION_BACKUP_RETENTION:-1}
      - NOTION_BACKUP_MAX_AGE=${NOTION_BACKUP_MAX_AGE:-43200}
      - NOTION_MAX_FILE_BYTES=${NOTION_MAX_FILE_BYTES:-536870912}
      - NOTION_ALLOW_MISSING=${NOTION_ALLOW_MISSING:-0}
      - NOTION_MAX_REQUESTS=${NOTION_MAX_REQUESTS:-20000}
      - NOTION_API_DELAY_SECONDS=${NOTION_API_DELAY_SECONDS:-0.75}
      - NOTION_LOG_DIR=/logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./notion-backup/backup:/backup
      - ./notion-backup/logs:/logs
      - ./backup_storage.py:/app/backup_storage.py:ro
    healthcheck:
      test: ["CMD", "python3", "/app/backup.py", "--health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 180m

  # ── caldav-backup: backup CalDAV calendars and tasks to ICS ───────────────
  caldav-backup:
    build:
      context: ./caldav-backup
    image: caldav-sync/caldav-backup:local
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - host.docker.internal:host-gateway
      - ${CALDAV_HOST_ALIAS:-caldav.example.invalid}:host-gateway
    volumes:
      - ./caldav-backup/backup:/backup
      - ./backup_storage.py:/app/backup_storage.py:ro
      - ./caldav-backup/logs:/logs
    environment:
      - CALDAV_BACKUP_DIR=/backup
      - CALDAV_BACKUP_RETENTION=${CALDAV_BACKUP_RETENTION:-14}
      - LOG_DIR=/logs
    command: ["--watch", "--interval", "${CALDAV_BACKUP_INTERVAL_SECONDS:-14400}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── google-contacts-backup: Incremental Google Contacts Backup ────────────
  google-contacts-backup:
    build:
      context: ./google-contacts-backup
    image: caldav-sync/google-contacts-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./google-contacts-backup/backup:/backup
      - ./backup_storage.py:/app/backup_storage.py:ro
      - ./google-contacts-backup/logs:/logs
      - ./vdirsyncer/state/token:/data/token:ro
      - ./settings:/app/project-settings:ro
      - ./setup/google:/run/syncer-google-client:ro
    environment:
      - LOG_DIR=/logs
      - BACKUP_DIR=/backup
      - GOOGLE_CONTACTS_SNAPSHOT_RETENTION=${GOOGLE_CONTACTS_SNAPSHOT_RETENTION:-14}
      - GOOGLE_CONTACTS_TOKEN_FILE=/data/token/google_contacts.json
      - GOOGLE_CLIENT_JSON_FILE=/run/syncer-google-client/client_secret.json
    healthcheck:
      test: ["CMD", "python3", "-c", "import googleapiclient, vobject; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
