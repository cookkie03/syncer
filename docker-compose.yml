x-dns-hosts: &dns-hosts
  # host.docker.internal allows containers to reach the host (NAS) directly.
  # The Synology hostname is pinned to avoid ISP DNS hijacking.
  extra_hosts:
    - "host.docker.internal:host-gateway"
    - "calendar.lucamanca.synology.me:${SYNOLOGY_IP:-79.50.144.75}"

services:

  # ── caldav-backup: backup CalDAV calendars and tasks to ICS ───────────────
  caldav-backup:
    build:
      context: ./caldav-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/caldav-backup:local
    restart: unless-stopped
    env_file: .env
    <<: *dns-hosts
    volumes:
      - ./caldav-backup/backup:/backup
    environment:
      - CALDAV_BACKUP_DIR=/backup
    command: ["--watch", "--interval", "14400"]
    healthcheck:
      test: ["CMD", "python", "-c", "import caldav; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── spotify-backup: export Spotify library to JSON ─────────────────────────
  spotify-backup:
    build:
      context: ./spotify-backup
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    image: caldav-sync/spotify-backup:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./spotify-backup/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import spotipy; print('ok')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
